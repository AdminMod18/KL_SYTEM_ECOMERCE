# CD: build → ECR → ECS Fargate (rama main / manual). Trunk-based: solo main despliega.
name: Deploy Backend AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Desplegar todos los microservicios (true) o solo los cambiados (false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.build-list.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_all != 'true'
        with:
          filters: |
            auth-service:
              - 'auth-service/**'
            user-service:
              - 'user-service/**'
            solicitud-service:
              - 'solicitud-service/**'
            validation-service:
              - 'validation-service/**'
            payment-service:
              - 'payment-service/**'
            order-service:
              - 'order-service/**'
            product-service:
              - 'product-service/**'
            notification-service:
              - 'notification-service/**'
            analytics-service:
              - 'analytics-service/**'
            admin-service:
              - 'admin-service/**'
            config-service:
              - 'config-service/**'

      - name: Armar lista de microservicios a desplegar
        id: build-list
        env:
          F_AUTH: ${{ steps.filter.outputs.auth-service }}
          F_USER: ${{ steps.filter.outputs.user-service }}
          F_SOL: ${{ steps.filter.outputs.solicitud-service }}
          F_VAL: ${{ steps.filter.outputs.validation-service }}
          F_PAY: ${{ steps.filter.outputs.payment-service }}
          F_ORD: ${{ steps.filter.outputs.order-service }}
          F_PRO: ${{ steps.filter.outputs.product-service }}
          F_NOT: ${{ steps.filter.outputs.notification-service }}
          F_ANA: ${{ steps.filter.outputs.analytics-service }}
          F_ADM: ${{ steps.filter.outputs.admin-service }}
          F_CFG: ${{ steps.filter.outputs.config-service }}
        run: |
          ALL='["auth-service","user-service","solicitud-service","validation-service","payment-service","order-service","product-service","notification-service","analytics-service","admin-service","config-service"]'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.deploy_all }}" = "true" ]; then
            echo "services=${ALL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LIST=()
          [ "$F_AUTH" = "true" ] && LIST+=("auth-service")
          [ "$F_USER" = "true" ] && LIST+=("user-service")
          [ "$F_SOL" = "true" ] && LIST+=("solicitud-service")
          [ "$F_VAL" = "true" ] && LIST+=("validation-service")
          [ "$F_PAY" = "true" ] && LIST+=("payment-service")
          [ "$F_ORD" = "true" ] && LIST+=("order-service")
          [ "$F_PRO" = "true" ] && LIST+=("product-service")
          [ "$F_NOT" = "true" ] && LIST+=("notification-service")
          [ "$F_ANA" = "true" ] && LIST+=("analytics-service")
          [ "$F_ADM" = "true" ] && LIST+=("admin-service")
          [ "$F_CFG" = "true" ] && LIST+=("config-service")
          if [ ${#LIST[@]} -eq 0 ]; then
            echo "services=[]" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "${LIST[@]}" | jq -R . | jq -s -c .)
            echo "services=${JSON}" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE_PREFIX }}-${{ matrix.service }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY_PREFIX }}-${{ matrix.service }}
      ECS_CONTAINER_NAME: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar configuración AWS/ECS
        run: |
          if [ -z "${{ vars.ECS_CLUSTER }}" ]; then
            echo "::error::Configura la variable de repositorio ECS_CLUSTER."
            exit 1
          fi
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ] && { [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; }; then
            echo "::error::Configura secrets AWS_ROLE_ARN (OIDC) o AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY en Settings → Secrets."
            exit 1
          fi

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: Login a Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolver o crear repositorio ECR
        id: ecr-repo
        env:
          REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
          PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX || vars.PROJECT_NAME || 'kl-ecommerce' }}
          ECR_NAMING: ${{ vars.ECR_NAMING || 'auto' }}
        run: |
          set -euo pipefail
          SERVICE="${{ matrix.service }}"

          repo_exists() {
            aws ecr describe-repositories --repository-names "$1" --region "$REGION" >/dev/null 2>&1
          }

          create_repo() {
            echo "Creando repositorio ECR: $1" >&2
            aws ecr create-repository \
              --repository-name "$1" \
              --region "$REGION" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 >/dev/null
            echo "$1"
          }

          if [ "$ECR_NAMING" = "service-only" ]; then
            CANDIDATES=("$SERVICE")
          elif [ "$ECR_NAMING" = "flat" ]; then
            CANDIDATES=("${PREFIX}-${SERVICE}")
          elif [ "$ECR_NAMING" = "namespaced" ]; then
            CANDIDATES=("${PREFIX}/${SERVICE}")
          else
            # auto: orden habitual en Terraform (nombre simple) y variantes del pipeline
            CANDIDATES=("$SERVICE" "${PREFIX}-${SERVICE}" "${PREFIX}/${SERVICE}")
          fi

          REPO=""
          for c in "${CANDIDATES[@]}"; do
            if repo_exists "$c"; then
              REPO="$c"
              echo "Repositorio ECR existente: $REPO" >&2
              break
            fi
          done

          if [ -z "$REPO" ]; then
            REPO=$(create_repo "${CANDIDATES[0]}")
          fi

          echo "repository=${REPO}" >> "$GITHUB_OUTPUT"
          echo "ECR_REPOSITORY=${REPO}" >> "$GITHUB_ENV"

      - name: Build y push imagen Docker
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}"
          echo "Push a ${IMAGE_URI}"
          docker build -t "${IMAGE_URI}:${IMAGE_TAG}" -t "${IMAGE_URI}:latest" "./${SERVICE}"
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"
          echo "IMAGE_URI=${IMAGE_URI}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Descargar task definition actual
        continue-on-error: true
        id: task-def
        run: |
          aws ecs describe-task-definition \
            --task-definition "${ECS_TASK_FAMILY}" \
            --query 'taskDefinition' \
            > task-definition.json
          python3 -c "
          import json
          with open('task-definition.json') as f:
              td = json.load(f)
          for k in ('taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy','deregisteredAt'):
              td.pop(k, None)
          with open('task-definition.json','w') as f:
              json.dump(td, f)
          "

      - name: Renderizar task definition con nueva imagen
        if: steps.task-def.outcome == 'success'
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Desplegar en ECS (nueva revisión de task)
        if: steps.task-def.outcome == 'success'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: ${{ vars.ECS_WAIT_STABILITY || 'false' }}

      - name: Forzar nuevo despliegue (si no hay task definition en ECS)
        if: steps.task-def.outcome != 'success'
        run: |
          echo "No se encontró task family ${ECS_TASK_FAMILY}; forzando rolling update."
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment \
            --region "${{ vars.AWS_REGION || 'us-east-2' }}"

      - name: Resumen despliegue
        run: |
          echo "### ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ECR repo: \`${ECR_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagen: \`${IMAGE_URI}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ECS cluster: \`${ECS_CLUSTER}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ECS service: \`${ECS_SERVICE}\`" >> "$GITHUB_STEP_SUMMARY"
