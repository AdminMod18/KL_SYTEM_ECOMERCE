# CD: build → ECR → ECS Fargate (solo rama main o manual).
name: Deploy Backend AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Desplegar todos los microservicios (true) o solo los cambiados (false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'kl-ecommerce' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'dev' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth-service: ${{ steps.filter.outputs.auth-service }}
      user-service: ${{ steps.filter.outputs.user-service }}
      solicitud-service: ${{ steps.filter.outputs.solicitud-service }}
      validation-service: ${{ steps.filter.outputs.validation-service }}
      payment-service: ${{ steps.filter.outputs.payment-service }}
      order-service: ${{ steps.filter.outputs.order-service }}
      product-service: ${{ steps.filter.outputs.product-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      analytics-service: ${{ steps.filter.outputs.analytics-service }}
      admin-service: ${{ steps.filter.outputs.admin-service }}
      config-service: ${{ steps.filter.outputs.config-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service:
              - 'auth-service/**'
            user-service:
              - 'user-service/**'
            solicitud-service:
              - 'solicitud-service/**'
            validation-service:
              - 'validation-service/**'
            payment-service:
              - 'payment-service/**'
            order-service:
              - 'order-service/**'
            product-service:
              - 'product-service/**'
            notification-service:
              - 'notification-service/**'
            analytics-service:
              - 'analytics-service/**'
            admin-service:
              - 'admin-service/**'
            config-service:
              - 'config-service/**'

  deploy:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - service: auth-service
            filter: ${{ needs.changes.outputs.auth-service }}
          - service: user-service
            filter: ${{ needs.changes.outputs.user-service }}
          - service: solicitud-service
            filter: ${{ needs.changes.outputs.solicitud-service }}
          - service: validation-service
            filter: ${{ needs.changes.outputs.validation-service }}
          - service: payment-service
            filter: ${{ needs.changes.outputs.payment-service }}
          - service: order-service
            filter: ${{ needs.changes.outputs.order-service }}
          - service: product-service
            filter: ${{ needs.changes.outputs.product-service }}
          - service: notification-service
            filter: ${{ needs.changes.outputs.notification-service }}
          - service: analytics-service
            filter: ${{ needs.changes.outputs.analytics-service }}
          - service: admin-service
            filter: ${{ needs.changes.outputs.admin-service }}
          - service: config-service
            filter: ${{ needs.changes.outputs.config-service }}
    # Solo servicios modificados, salvo workflow_dispatch con deploy_all=true
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_all == 'true') ||
      matrix.filter == 'true'
    env:
      SERVICE: ${{ matrix.service }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_PREFIX || vars.PROJECT_NAME || 'kl-ecommerce' }}/${{ matrix.service }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE_PREFIX }}-${{ matrix.service }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY_PREFIX }}-${{ matrix.service }}
      ECS_CONTAINER_NAME: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar configuración AWS/ECS
        run: |
          if [ -z "${{ vars.ECS_CLUSTER }}" ]; then
            echo "::error::Configura la variable de repositorio ECS_CLUSTER (nombre del cluster ECS)."
            exit 1
          fi
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ] && { [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; }; then
            echo "::error::Configura AWS_ROLE_ARN (OIDC recomendado) o AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY."
            exit 1
          fi

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push imagen Docker
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}"
          docker build -t "${IMAGE_URI}:${IMAGE_TAG}" -t "${IMAGE_URI}:latest" "./${SERVICE}"
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"
          echo "IMAGE_URI=${IMAGE_URI}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Descargar task definition actual
        continue-on-error: true
        id: task-def
        run: |
          aws ecs describe-task-definition \
            --task-definition "${ECS_TASK_FAMILY}" \
            --query 'taskDefinition' \
            > task-definition.json
          python3 -c "
          import json
          with open('task-definition.json') as f:
              td = json.load(f)
          for k in ('taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy','deregisteredAt'):
              td.pop(k, None)
          with open('task-definition.json','w') as f:
              json.dump(td, f)
          "

      - name: Renderizar task definition con nueva imagen
        if: steps.task-def.outcome == 'success'
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Desplegar en ECS (nueva revisión de task)
        if: steps.task-def.outcome == 'success'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: ${{ vars.ECS_WAIT_STABILITY || 'false' }}

      - name: Forzar nuevo despliegue (si no hay task definition en ECS)
        if: steps.task-def.outcome != 'success'
        run: |
          echo "No se encontró task family ${ECS_TASK_FAMILY}; forzando rolling update con imagen :latest en ECR."
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment \
            --region "${AWS_REGION}"

      - name: Resumen despliegue
        run: |
          echo "### ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagen: \`${IMAGE_URI}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ECS cluster: \`${ECS_CLUSTER}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ECS service: \`${ECS_SERVICE}\`" >> "$GITHUB_STEP_SUMMARY"
