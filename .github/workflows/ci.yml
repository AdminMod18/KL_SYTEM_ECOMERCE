# CI: tests Gradle + build Docker por microservicio modificado (trunk: PR y push a main).
name: CI Backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.build-list.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service:
              - 'auth-service/**'
            user-service:
              - 'user-service/**'
            solicitud-service:
              - 'solicitud-service/**'
            validation-service:
              - 'validation-service/**'
            payment-service:
              - 'payment-service/**'
            order-service:
              - 'order-service/**'
            product-service:
              - 'product-service/**'
            notification-service:
              - 'notification-service/**'
            analytics-service:
              - 'analytics-service/**'
            admin-service:
              - 'admin-service/**'
            config-service:
              - 'config-service/**'
            github:
              - '.github/**'

      - name: Lista de microservicios a validar
        id: build-list
        env:
          F_AUTH: ${{ steps.filter.outputs.auth-service }}
          F_USER: ${{ steps.filter.outputs.user-service }}
          F_SOL: ${{ steps.filter.outputs.solicitud-service }}
          F_VAL: ${{ steps.filter.outputs.validation-service }}
          F_PAY: ${{ steps.filter.outputs.payment-service }}
          F_ORD: ${{ steps.filter.outputs.order-service }}
          F_PRO: ${{ steps.filter.outputs.product-service }}
          F_NOT: ${{ steps.filter.outputs.notification-service }}
          F_ANA: ${{ steps.filter.outputs.analytics-service }}
          F_ADM: ${{ steps.filter.outputs.admin-service }}
          F_CFG: ${{ steps.filter.outputs.config-service }}
          F_GH: ${{ steps.filter.outputs.github }}
        run: |
          ALL='["auth-service","user-service","solicitud-service","validation-service","payment-service","order-service","product-service","notification-service","analytics-service","admin-service","config-service"]'
          if [ "$F_GH" = "true" ]; then
            echo "services=${ALL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LIST=()
          [ "$F_AUTH" = "true" ] && LIST+=("auth-service")
          [ "$F_USER" = "true" ] && LIST+=("user-service")
          [ "$F_SOL" = "true" ] && LIST+=("solicitud-service")
          [ "$F_VAL" = "true" ] && LIST+=("validation-service")
          [ "$F_PAY" = "true" ] && LIST+=("payment-service")
          [ "$F_ORD" = "true" ] && LIST+=("order-service")
          [ "$F_PRO" = "true" ] && LIST+=("product-service")
          [ "$F_NOT" = "true" ] && LIST+=("notification-service")
          [ "$F_ANA" = "true" ] && LIST+=("analytics-service")
          [ "$F_ADM" = "true" ] && LIST+=("admin-service")
          [ "$F_CFG" = "true" ] && LIST+=("config-service")
          if [ ${#LIST[@]} -eq 0 ]; then
            echo "services=[]" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "${LIST[@]}" | jq -R . | jq -s -c .)
            echo "services=${JSON}" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Gradle test (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then
            ./gradlew test --no-daemon
          else
            gradle test --no-daemon
          fi

      - name: Gradle build sin tests (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew build -x test --no-daemon
          else
            gradle build -x test --no-daemon
          fi

  docker-build-smoke:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (${{ matrix.service }})
        run: docker build -t ${{ matrix.service }}:ci-${{ github.sha }} ./${{ matrix.service }}
